# Checks the server, then cross-compiles the Pi bundle (helix-bridge + tonepush)
# for aarch64-unknown-linux-gnu. The Pi never compiles (AGENTS.md 5.1).
#
# - Every push / PR: checks, then the bundle as a workflow artifact.
# - Tag v*: the same, plus a GitHub release with the tarball attached.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # TonePush pin (AGENTS.md 3). Bump both together, on purpose.
  TONEPUSH_TAG: v0.9.0
  TONEPUSH_COMMIT: 5e44812c53afddf36b2bc38d2355e75341049659
  # glibc 2.31 floor: runs on Raspberry Pi OS 64-bit Bullseye, Bookworm and Trixie.
  TARGET: aarch64-unknown-linux-gnu
  GLIBC: "2.31"
  ZIG_VERSION: "0.17.0"
  ZIGBUILD_VERSION: "0.23.4"

# Every action is pinned to a commit SHA, not a tag that can move: the Pi
# installs what this builds, as root. Dependabot proposes the bumps
# (.github/dependabot.yml); the `check` job refuses an unpinned `uses:`.
jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # A pinned SHA cannot name the toolchain, so `toolchain:` does.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Our patched TonePush hx-usb (third_party/hx-usb/PATCHES.md).
      - run: cargo test --locked -p hx-usb
      - name: shellcheck deploy scripts
        working-directory: .
        run: shellcheck deploy/*.sh deploy/tests/*.sh
      - name: own Wi-Fi script (fake nmcli)
        working-directory: .
        run: sh deploy/tests/hotspot.test.sh
      - name: actions pinned to commit SHAs
        working-directory: .
        run: |
          if grep -nE '^\s*(- )?uses:' .github/workflows/*.yml | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "pin these to a full commit SHA (see the comment above jobs:)"
            exit 1
          fi
      - name: web unit tests (rate limiter)
        working-directory: .
        run: node --test web/tests/latest.test.mjs

  # Runs beside `check`, not after it: the run only counts as green (and the
  # Pi's updater only takes a green run) when both jobs pass.
  pi-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: crmne/tonepush
          ref: ${{ env.TONEPUSH_TAG }}
          path: tonepush
      - name: Verify TonePush pin
        run: |
          got=$(git -C tonepush rev-parse HEAD)
          [ "$got" = "$TONEPUSH_COMMIT" ] || { echo "TonePush $TONEPUSH_TAG is $got, expected $TONEPUSH_COMMIT"; exit 1; }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
      # Prebuilt wheels; compiling cargo-zigbuild from source took 1.5 min.
      - name: Install zig and cargo-zigbuild
        run: |
          pip install --only-binary=:all: "ziglang==$ZIG_VERSION" "cargo-zigbuild==$ZIGBUILD_VERSION"
      # No compiler cache for shipped binaries.
      - name: Build helix-bridge
        working-directory: server
        run: cargo zigbuild --release --locked --target "$TARGET.$GLIBC"
      # TonePush is pinned, so its binary only changes with the pin or the
      # build tools: cache it under exactly those (saves 1.5 min a build).
      - name: Restore tonepush
        id: tonepush-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: tonepush/target/${{ env.TARGET }}/release/tonepush
          key: tonepush-${{ env.TONEPUSH_COMMIT }}-${{ env.TARGET }}.${{ env.GLIBC }}-zig${{ env.ZIG_VERSION }}-zigbuild${{ env.ZIGBUILD_VERSION }}
      # TonePush pins its own toolchain; add the target to that one.
      - name: Build tonepush
        if: steps.tonepush-cache.outputs.cache-hit != 'true'
        working-directory: tonepush
        run: |
          rustup target add "$TARGET"
          cargo zigbuild --release --locked -p tonepush-cli --target "$TARGET.$GLIBC"
      - name: Package
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -n 1)-${GITHUB_SHA::7}
          fi
          deploy/package.sh "$version" \
            "server/target/$TARGET/release/helix-bridge" \
            "tonepush/target/$TARGET/release/tonepush" \
            tonepush dist
          ls -l dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pi-bundle
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [check, pi-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pi-bundle
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          body: |
            Pi bundle for 64-bit Raspberry Pi OS. Includes TonePush ${{ env.TONEPUSH_TAG }} (MIT).
            Install: see docs/deploy.md.
