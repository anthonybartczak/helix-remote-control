<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0e">
<title>Helix Bridge</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" type="button" data-sidebar aria-controls="sidebar" aria-pressed="true" aria-label="Preset list" title="Show or hide the preset list">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15"/><path class="sidebar-toggle-fill" d="M4.5 6h3v12h-3z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div class="brand">HELIX BRIDGE</div>
    <div class="device-name" id="device-name"></div>
    <div class="spacer"></div>
    <button class="conn conn-pill" type="button" data-conn aria-haspopup="dialog"></button>
    <button class="icon-btn settings-btn" type="button" data-conn aria-haspopup="dialog" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#gear"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="caps">PRESETS</div>
        <button class="chip" type="button" data-open-browser id="all-chip">All</button>
      </div>
      <ol class="preset-list" id="preset-list"></ol>
    </aside>

    <main class="main">
      <div class="presetbar">
        <button class="btn presets-btn" type="button" data-open-browser>Presets</button>
        <button class="btn arrow later" type="button" data-step="-1" disabled aria-label="Previous preset">‹</button>
        <button class="btn arrow later" type="button" data-step="1" disabled aria-label="Next preset">›</button>
        <div class="namebar" id="namebar">
          <span class="nb-label" id="nb-label">–</span>
          <span class="nb-name" id="nb-name"></span>
          <span class="nb-status" id="nb-status"></span>
          <div class="spacer"></div>
          <button class="act later later-sm rename-btn" type="button" id="rename-btn" aria-label="Rename" disabled><span class="rename-text">Rename</span><svg class="rename-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
          <button class="act later later-sm" type="button" id="save-btn" disabled>Save</button>
          <button class="conn conn-dots" type="button" data-conn aria-haspopup="dialog" aria-label="Settings and connection"></button>
          <div class="progress" id="progress"></div>
        </div>
        <div class="snaps snaps-inline" id="snaps-inline"></div>
        <div class="tempo">
          <button class="tempo-readout" type="button" id="tempo-btn" disabled aria-label="Tempo. Tap to type a value"><span class="tempo-bpm" id="tempo">–</span><span class="tempo-unit"><span class="desktop-only">BPM · PRESET</span><span class="tablet-only">BPM</span></span></button>
          <button class="act later tap" type="button" id="tap-btn" disabled aria-label="Tap tempo">TAP</button>
        </div>
        <button class="conn conn-pill blocked-only" type="button" data-conn aria-haspopup="dialog"></button>
      </div>

      <div class="snaps snaps-row" id="snaps-row"></div>

      <div class="banner" id="banner" role="alert" hidden>
        <div class="banner-dot"></div>
        <div class="banner-msg" id="banner-msg"></div>
        <div class="banner-ctx" id="banner-ctx"></div>
        <div class="spacer"></div>
        <button class="btn-solid" type="button" data-retry>Retry</button>
        <button class="icon-btn" type="button" id="banner-close" aria-label="Dismiss">×</button>
      </div>

      <section class="chain" id="chain" aria-label="Signal chain"></section>

      <div class="lower">
        <section class="params" id="params" aria-label="Parameters"></section>
      </div>

      <div class="blocker" id="blocker" hidden>
        <div class="blocker-body">
          <div class="blocker-icon" id="blocker-icon">USB</div>
          <div class="blocker-title" id="blocker-title"></div>
          <div class="blocker-text" id="blocker-text"></div>
          <div class="blocker-detail" id="blocker-detail"></div>
          <button class="btn-solid btn-wide" type="button" data-retry>Try again</button>
          <div class="blocker-auto">Retrying automatically every 5 s</div>
        </div>
      </div>
    </main>
  </div>

  <footer class="statusline" id="statusline"></footer>
</div>

<div class="sheet" id="browser" role="dialog" aria-modal="true" aria-label="Presets" hidden>
  <div class="sheet-head">
    <button class="icon-btn close-btn portrait-only" type="button" data-close-browser aria-label="Close">×</button>
    <div class="sheet-title landscape-only">Presets</div>
    <input class="filter" id="filter" type="search" placeholder="Filter by name or label" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="spacer landscape-only"></div>
    <div class="legend landscape-only"><span class="sw sw-loaded"></span>Loaded<span class="sw sw-selected"></span>Selected</div>
    <button class="icon-btn close-btn landscape-only" type="button" data-close-browser aria-label="Close">×</button>
  </div>
  <div class="sheet-body">
    <div class="banks" id="banks"></div>
    <nav class="jumps portrait-only" id="jumps" aria-label="Jump to bank"></nav>
  </div>
  <div class="sheet-foot">
    <span class="sf-label" id="sf-label"></span>
    <span class="sf-name" id="sf-name"></span>
    <span class="sf-note landscape-only" id="sf-note"></span>
    <div class="spacer"></div>
    <button class="act later load-btn" type="button" id="load-btn" disabled>Load</button>
  </div>
</div>

<div class="sheet" id="picker" role="dialog" aria-modal="true" aria-label="Add block" hidden>
  <div class="sheet-head">
    <button class="icon-btn close-btn portrait-only" type="button" data-close-picker aria-label="Close">×</button>
    <div class="sheet-title landscape-only" id="picker-title">Add block</div>
    <input class="filter" id="model-filter" type="search" placeholder="Filter by model or gear" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <div class="spacer landscape-only"></div>
    <button class="icon-btn close-btn landscape-only" type="button" data-close-picker aria-label="Close">×</button>
  </div>
  <div class="sheet-body picker-body">
    <nav class="cats" id="cats" aria-label="Categories"></nav>
    <div class="models" id="models"></div>
  </div>
  <div class="sheet-foot">
    <span class="sf-label" id="pf-slot"></span>
    <span class="sf-name" id="pf-name"></span>
    <span class="sf-note landscape-only" id="pf-note"></span>
    <div class="spacer"></div>
    <div class="seg pf-variant" id="pf-variant" role="group" aria-label="Mono or stereo" hidden></div>
    <label class="pf-fs" id="pf-fs-wrap" hidden><span class="pf-fs-label landscape-only">Footswitch</span>
      <select class="menu pf-fs-select" id="pf-fs" aria-label="Footswitch for the new block"></select></label>
    <button class="act later load-btn" type="button" id="add-btn" disabled>Add</button>
  </div>
</div>

<div class="popover" id="conn-popover" role="dialog" aria-label="Settings and connection" hidden>
  <div class="caps muted">SETTINGS</div>
  <div class="setting">
    <div class="setting-name">Block names</div>
    <div class="seg setting-seg" role="group" aria-label="Block names" id="set-names"></div>
    <div class="setting-note">Line 6's model names, or the gear each model is based on.</div>
  </div>
  <div class="setting">
    <div class="setting-name">Preset list on the left</div>
    <div class="seg setting-seg" role="group" aria-label="Preset list on the left" id="set-sidebar"></div>
    <div class="setting-note" id="set-sidebar-note"></div>
  </div>
  <div class="setting-note">Settings stay in this browser.</div>
  <div class="caps muted popover-sep">CONNECTION</div>
  <dl class="kv" id="conn-info"></dl>
  <button class="btn-solid" type="button" data-retry>Refresh from device</button>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
</svg>

<script src="lib/motion-13.4.6.js"></script>
<script src="latest.js"></script>
<script src="app.js"></script>
</body>
</html>
