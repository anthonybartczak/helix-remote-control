[package]
name = "hx-usb"
description = "Connect to a Line 6 Helix or HX guitar pedal over USB and edit what it is playing"
# Vendored from TonePush v0.9.0 (commit 5e44812) with the patches listed in
# PATCHES.md. Upstream: https://github.com/crmne/tonepush (MIT, see LICENSE).
version = "0.9.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/crmne/tonepush"
rust-version = "1.87"

[dependencies]
hx-proto = { git = "https://github.com/crmne/tonepush", tag = "v0.9.0" }
# nusb is pure Rust, so there is no libusb to cross-compile. It also exposes
# Device::from_fd, which is the only way in on Android: the Java USB Host API
# hands the app a file descriptor and nothing else.
nusb = "0.2"
thiserror = "2"
# A backup bundle's manifest is JSON, so a person can open one and read what it
# holds without this program.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each bundle file is durable before its manifest can point at it.
atomic-write-file = "0.3.1"
